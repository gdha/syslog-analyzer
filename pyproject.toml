[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syslog-analyzer"
version = "0.1.0"
description = "Scan Linux system logs for serious errors and security-related activity"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
syslog-analyzer = "syslog_analyzer.__main__:main"

[project.optional-dependencies]
build = ["pyinstaller==6.22.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["syslog_analyzer*"]
